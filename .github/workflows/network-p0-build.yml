name: NETWORK P0 Build

on:
  push:
    branches:
      - p0-performance-baseline
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: micro_apk
        run: flutter pub get

      - name: Run Flutter tests
        working-directory: micro_apk
        run: flutter test

      - name: Build release APK with P0 trace enabled
        working-directory: micro_apk
        run: flutter build apk --release --dart-define=PERF_TRACE=true

      - name: Publish NETWORK APK
        uses: actions/upload-artifact@v4
        with:
          name: NETWORK-APK
          path: micro_apk/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
