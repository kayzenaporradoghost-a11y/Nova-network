name: micro_apk
description: NETWORK - assistente de IA com automação e conexão SSH multi-VPS
publish_to: "none"
version: 3.2.1+6
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  gpt_markdown: ^1.4.1
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  http: ^1.5.0
  html: ^0.15.4
  in_app_webview_flutter: ^1.1.0
  dartssh2: ^2.11.0
  flutter_secure_storage: ^9.2.2
